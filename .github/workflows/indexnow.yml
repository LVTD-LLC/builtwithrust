name: IndexNow

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy production']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: indexnow-production
  cancel-in-progress: false

jobs:
  submit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        with:
          path: .indexnow/snapshot.json
          key: indexnow-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: indexnow-v1-
      - name: Submit changed URLs (full refresh after deployment)
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = workflow_run ]; then
            python scripts/indexnow.py --force
          else
            python scripts/indexnow.py
          fi
      - uses: actions/cache/save@v4
        with:
          path: .indexnow/snapshot.json
          key: indexnow-v1-${{ github.run_id }}-${{ github.run_attempt }}
