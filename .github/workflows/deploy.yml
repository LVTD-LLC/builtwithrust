name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/lvtd-llc/builtwithrust:${{ github.sha }}
          build-args: BUILD_REVISION=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/LVTD-LLC/builtwithrust
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy to CapRover
        uses: caprover/deploy-from-github@68ab51ebfb8da5054c20427f4e8e654a1cb2fbbf
        with:
          server: ${{ secrets.CAPROVER_SERVER }}
          app: builtwithrust
          token: ${{ secrets.APP_TOKEN }}
          image: ghcr.io/lvtd-llc/builtwithrust:${{ github.sha }}
      - name: Verify deployed revision and public health
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 10 \
              --dump-header /tmp/health-headers --output /tmp/health-body \
              https://builtwithrust.com/healthz &&
              tr -d '\r' < /tmp/health-headers | grep -Fxi "x-deployment-revision: ${EXPECTED_REVISION}" &&
              test "$(cat /tmp/health-body)" = "ok"; then
              exit 0
            fi
            echo "Waiting for revision ${EXPECTED_REVISION} (attempt ${attempt}/60)"
            sleep 5
          done
          echo "Expected revision did not become healthy" >&2
          exit 1
