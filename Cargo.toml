[package]
name = "builtwithrust"
version = "0.1.0"
edition = "2024"
description = "A directory of websites, apps and tools built with Rust. Itself built with Rust."
license = "MIT"
repository = "https://github.com/rasulkireev/builtwithrust"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8", features = ["macros"] }
brotli = "9.0.0"
bytes = "1.12.1"
dashmap = "6.2.1"
dotenvy = "0.15.7"
flate2 = "1.1.10"
hex = "0.4.3"
hmac = "0.13.0"
maud = { version = "0.27.0", features = ["axum"] }
mime_guess = "2.0.5"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2", "form"] }
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "time"] }
subtle = "2.6.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1.53.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace", "timeout", "limit", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true
